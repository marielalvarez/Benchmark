# Configuración declarativa de E0A: selección del "mejor" candidato entre
# Hur, Wei y Gong sobre los tres datasets del rediseño de Semana 2
# (2026-08-24), que reemplazan los dos datasets del diseño original
# (2026-08-14: MNIST 1 vs 8, Fashion-MNIST camiseta-vs-pantalón -- ver la
# nota de obsolescencia en notebooks/00_reproduce_hur.ipynb y
# 00_reproduce_wei.ipynb).
#
# Validar con: qcnn_benchmark.config.load_config("configs/e0a.yaml")
# Identificar la corrida con: config.canonical_hash()

experiment_id: E0A
description: >
  Comparación Hur vs. Wei vs. Gong (E0, sin ruido, simulador analítico) sobre
  los tres datasets del rediseño de Semana 2, para seleccionar el candidato
  que avanza a E1/E2. Cong queda fuera de E0A -- es la QCNN genérica de
  referencia de E0B (validez de la aportación), no un candidato a "mejor".

datasets:
  - name: coat_vs_shirt
    source: fashion_mnist
    class_pos: 4  # Coat
    class_neg: 6  # Shirt
  - name: "4_vs_9"
    source: mnist
    class_pos: 4
    class_neg: 9
  - name: "1_vs_0"
    source: mnist
    class_pos: 1
    class_neg: 0

models:
  - hur
  - wei
  - gong

protocol:
  batch_size: 25
  # 500, no 200: a 200 actualizaciones Wei no alcanza a converger en su
  # propio dataset de fidelidad (94.8% vs. objetivo 96.3%; a 500 sube a
  # 95.8%, ver notebooks/00_reproduce_wei.ipynb Sec. 3.1). Los tres
  # modelos deben compartir el mismo techo de actualizaciones en E0A para
  # que la comparación no quede contaminada por una ventaja de
  # presupuesto de entrenamiento -- no hay evidencia de que 200 le baste
  # a Hur/Gong tampoco en los tres datasets nuevos (distintos a sus
  # datasets de fidelidad). El early stopping (paciencia 5, delta 1e-4)
  # sigue intacto: esto solo sube el techo del que puede detenerse antes,
  # no fuerza a ningún modelo a correr las 500 si converge antes.
  n_updates: 500
  learning_rate: 0.01
  beta1: 0.9
  beta2: 0.999
  clip_norm: 5.0
  val_check_every: 10
  patience_checks: 5
  min_delta: 0.0001

n_seeds: 5
seed_root: 0  # run_seeds = [0, 1, 2, 3, 4] -- semilla 0 coincide con las corridas de fidelidad ya hechas
sample_seed: 20260802  # qcnn_benchmark.data.sampling.SAMPLE_SEED -- misma partición fija en todo el framework

statistical_criterion:
  aggregation: mean_per_dataset
  ci_method: bootstrap_bca
  n_bootstrap: 10000
  confidence_level: 0.95
  comparison_test: paired_sign_permutation
  multiple_comparison_correction: holm
  alpha: 0.05
