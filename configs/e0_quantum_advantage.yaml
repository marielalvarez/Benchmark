# Configuración declarativa de E0_quantum_advantage: WINNER_MODEL (el
# ganador de E0A) vs. su CNN análoga (cnn_<winner>_analoga), mismo
# protocolo y criterio estadístico que E0A.
#
# `models` abajo es un placeholder -- WINNER_MODEL se decide en tiempo de
# ejecución (lo que imprime la Sec. 10 de E0A_seleccion_candidato.ipynb),
# no puede quedar fijo en este YAML. El notebook lo resuelve así, en su
# celda de INPUTS MANUALES, antes de usar `config` para nada más:
#
#   config = config.model_copy(update={"models": [WINNER_MODEL, f"cnn_{WINNER_MODEL}_analoga"]})
#
# Nótese que esto SÍ cambia canonical_hash() respecto al de este YAML sin
# tocar -- es intencional: dos corridas con distinto WINNER_MODEL deben
# quedar en archivos de resultados distintos.

experiment_id: E0_QUANTUM_ADVANTAGE
description: >
  ¿El QCNN ganador de E0A supera a una CNN clásica con conteo de
  parámetros comparable? Resultado informativo para la narrativa de
  Quantum Advantage del paper -- no alimenta ninguna decisión de E0B/E1/E2
  (esas fases usan WINNER_MODEL directamente, no el resultado de esta
  comparación). Dado lo observado en E0A (n=5 semillas), es esperable que
  el test de permutación de signo tampoco alcance significancia aquí --
  por eso el análisis también reporta solape de IC bootstrap BCa como
  evidencia complementaria desde el inicio, no como parche posterior.

datasets:
  - name: coat_vs_shirt
    source: fashion_mnist
    class_pos: 4  # Coat
    class_neg: 6  # Shirt
  - name: "4_vs_9"
    source: mnist
    class_pos: 4
    class_neg: 9
  - name: "1_vs_0"
    source: mnist
    class_pos: 1
    class_neg: 0

models:
  - placeholder_winner  # el notebook lo reemplaza por [WINNER_MODEL, "cnn_<winner>_analoga"]

protocol:
  batch_size: 25
  n_updates: 500  # mismo techo que E0A, ver notebooks/E0A_seleccion_candidato.ipynb Sec. 2
  learning_rate: 0.01
  beta1: 0.9
  beta2: 0.999
  clip_norm: 5.0
  val_check_every: 10
  patience_checks: 5
  min_delta: 0.0001

n_seeds: 5
seed_root: 0
sample_seed: 20260802

statistical_criterion:
  aggregation: mean_per_dataset
  ci_method: bootstrap_bca
  n_bootstrap: 10000
  confidence_level: 0.95
  comparison_test: paired_sign_permutation
  multiple_comparison_correction: holm
  alpha: 0.05
